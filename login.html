<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | MK Career Guidance</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>

<body>

<div id="header-placeholder"></div>

<main class="login-page">

    <section class="login-left">

        <div class="welcome-content">

            <span class="badge">
                WELCOME BACK
            </span>

            <h1>
                Your Future.<br>
                <span>Your Right Guidance.</span>
            </h1>

            <p>
                Login to access your career guidance dashboard,
                student information and counselling resources.
            </p>

        </div>

    </section>

    <section class="login-right">

        <div class="login-card">

            <div class="mobile-logo">
                <img src="images/logo.png" alt="MK Career Guidance">
            </div>

            <div class="login-heading">

                <h1>Welcome Back</h1>

                <p>
                    Login to continue to your dashboard
                </p>

            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-box">

                        <span class="input-icon">👤</span>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter username"
                            autocomplete="username"
                            required>

                    </div>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            id="togglePassword">
                            Show
                        </button>

                    </div>

                </div>

                <div
                    id="loginError"
                    class="login-error">
                </div>

                <button
                    type="submit"
                    id="loginButton"
                    class="login-submit">

                    <span id="loginText">
                        Login
                    </span>

                    <span
                        id="loginLoader"
                        class="loader">
                    </span>

                </button>

            </form>

            <a
                href="index.html"
                class="back-home">
                ← Back to Home
            </a>

        </div>

    </section>

</main>

<script src="js/script.js"></script>
<script src="js/url.js"></script>
<script src="js/login.js"></script>

</body>
</html>

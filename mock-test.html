<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Discovery Quiz</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }

        .quiz-modal .modal-content {
            border: 0;
            border-radius: 24px;
            overflow: hidden;
        }

        .quiz-header {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
            padding: 25px;
        }

        .quiz-header h3 {
            font-weight: 700;
        }

        .progress {
            height: 8px;
            border-radius: 10px;
        }

        .question-number {
            color: #6a11cb;
            font-weight: 700;
            font-size: 14px;
        }

        .question-text {
            font-size: 22px;
            font-weight: 700;
            color: #222;
        }

        .option {
            border: 2px solid #e9ecef;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s;
            background: #fff;
        }

        .option:hover {
            border-color: #6a11cb;
            background: #f8f4ff;
        }

        .option.selected {
            border-color: #2575fc;
            background: #eef5ff;
        }

        .option-letter {
            display: inline-flex;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            background: #6a11cb;
            color: white;
            font-weight: 700;
            margin-right: 10px;
        }

        .quiz-footer {
            padding: 20px 25px;
            border-top: 1px solid #eee;
        }

        .result-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto;
        }

        .result-score {
            font-size: 38px;
            font-weight: 800;
        }
    </style>
</head>

<body>

<div class="modal fade quiz-modal" id="quizModal" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">

            <div class="quiz-header">
                <h3>Career Discovery Quiz</h3>
                <p class="mb-3">
                    Discover the type of career areas that match your interests.
                </p>

                <div class="d-flex justify-content-between">
                    <span id="progressText">Question 1 of 5</span>
                    <span>10 Marks</span>
                </div>

                <div class="progress mt-2">
                    <div id="progressBar"
                         class="progress-bar"
                         style="width: 20%">
                    </div>
                </div>
            </div>

            <div class="modal-body p-4">

                <div id="quizContainer">

                    <div class="question-number mb-2" id="questionNumber">
                        QUESTION 1
                    </div>

                    <div class="question-text mb-4" id="questionText">
                        Loading question...
                    </div>

                    <div id="optionsContainer"></div>

                </div>

                <div id="resultContainer" class="text-center d-none">

                    <div class="result-circle mb-4">
                        <div class="result-score" id="resultScore">0/10</div>
                        <div>Score</div>
                    </div>

                    <h3 class="fw-bold">Quiz Completed!</h3>

                    <p class="text-muted" id="resultMessage">
                        Your career discovery quiz is completed.
                    </p>

                    <div class="row mt-4">
                        <div class="col-6">
                            <div class="border rounded-3 p-3">
                                <h4 class="text-success" id="correctCount">0</h4>
                                <small>Correct</small>
                            </div>
                        </div>

                        <div class="col-6">
                            <div class="border rounded-3 p-3">
                                <h4 class="text-danger" id="wrongCount">0</h4>
                                <small>Wrong</small>
                            </div>
                        </div>
                    </div>

                    <button type="button" id="doneBtn"
                            class="btn btn-primary mt-4 px-5"
                            data-bs-dismiss="modal">
                        Done
                    </button>
                </div>

            </div>

            <div class="quiz-footer" id="quizFooter">

                <div class="d-flex justify-content-between">

                    <button type="button"
                            class="btn btn-outline-secondary"
                            id="backBtn"
                            disabled>
                        ← Back
                    </button>

                    <button type="button"
                            class="btn btn-primary px-4"
                            id="nextBtn">
                        Next →
                    </button>

                </div>

            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="js/url.js"></script>
<script src="js/mock-test.js"></script>
</body>
</html>
